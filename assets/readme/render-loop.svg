<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Remotion daily video render loop</title>
  <desc id="desc">A five step loop for turning a content brief into a checked video artifact and a reusable rule.</desc>
  <rect width="1200" height="280" rx="24" fill="#fff8ee"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(42 58)"><rect width="196" height="140" rx="16" fill="#f6e0cb"/><text x="20" y="34" font-size="12" letter-spacing="2" fill="#b45e37">01</text><text x="20" y="76" font-family="Georgia,serif" font-size="24" fill="#2d2521">Brief</text><text x="20" y="108" font-size="13" fill="#6d6258">topic + evidence</text></g>
    <g transform="translate(272 58)"><rect width="196" height="140" rx="16" fill="#f7d7ce"/><text x="20" y="34" font-size="12" letter-spacing="2" fill="#a84e45">02</text><text x="20" y="76" font-family="Georgia,serif" font-size="24" fill="#2d2521">Compose</text><text x="20" y="108" font-size="13" fill="#6d6258">JSON + components</text></g>
    <g transform="translate(502 58)"><rect width="196" height="140" rx="16" fill="#e3e8c8"/><text x="20" y="34" font-size="12" letter-spacing="2" fill="#65753d">03</text><text x="20" y="76" font-family="Georgia,serif" font-size="24" fill="#2d2521">Still</text><text x="20" y="108" font-size="13" fill="#6d6258">layout + safe area</text></g>
    <g transform="translate(732 58)"><rect width="196" height="140" rx="16" fill="#dbe5e0"/><text x="20" y="34" font-size="12" letter-spacing="2" fill="#397568">04</text><text x="20" y="76" font-family="Georgia,serif" font-size="24" fill="#2d2521">Render</text><text x="20" y="108" font-size="13" fill="#6d6258">MP4 + signatures</text></g>
    <g transform="translate(962 58)"><rect width="196" height="140" rx="16" fill="#2d2521"/><text x="20" y="34" font-size="12" letter-spacing="2" fill="#ffbd76">05</text><text x="20" y="76" font-family="Georgia,serif" font-size="24" fill="#fff8ee">Learn</text><text x="20" y="108" font-size="13" fill="#c8c1b5">rule → tomorrow</text></g>
  </g>
  <g fill="none" stroke="#b45e37" stroke-width="2"><path d="M238 128h28M468 128h28M698 128h28M928 128h28"/><path d="m252 121 12 7-12 7M482 121l12 7-12 7M712 121l12 7-12 7M942 121l12 7-12 7"/></g>
</svg>
