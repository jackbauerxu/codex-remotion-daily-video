<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex Remotion Daily Video</title>
  <desc id="desc">A warm orange video timeline turns structured content JSON into a validated daily video.</desc>
  <rect width="1200" height="500" rx="28" fill="#151515"/>
  <rect x="56" y="58" width="1088" height="330" rx="18" fill="#1f1f1f" stroke="#3b3b3b"/>
  <g stroke="#4a4a4a" opacity=".7"><path d="M78 110h1044M78 160h1044M78 210h1044M78 260h1044M78 310h1044"/><path d="M148 82v282M218 82v282M288 82v282M358 82v282M428 82v282M498 82v282M568 82v282M638 82v282M708 82v282M778 82v282M848 82v282M918 82v282M988 82v282M1058 82v282"/></g>
  <text x="76" y="95" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#ffbd76" letter-spacing="4">CONTENT JSON / REMOTION / DAILY LOOP</text>
  <text x="76" y="151" font-family="ui-sans-serif,system-ui,sans-serif" font-size="51" font-weight="700" fill="#fff6e8" letter-spacing="-2">Daily Video</text>
  <text x="78" y="182" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#c8c1b5">A reusable production line for topics that come back tomorrow.</text>
  <g transform="translate(78 230)" font-family="ui-sans-serif,system-ui,sans-serif">
    <rect width="230" height="84" rx="12" fill="#2c2520" stroke="#7d5438"/><text x="20" y="31" font-size="12" letter-spacing="2" fill="#ffbd76">INPUT</text><text x="20" y="60" font-size="20" fill="#fff6e8">content.json</text>
    <rect x="258" width="230" height="84" rx="12" fill="#332421" stroke="#93483d"/><text x="278" y="31" font-size="12" letter-spacing="2" fill="#ff927c">COMPOSE</text><text x="278" y="60" font-size="20" fill="#fff6e8">scenes + captions</text>
    <rect x="516" width="230" height="84" rx="12" fill="#2a2d22" stroke="#6b784a"/><text x="536" y="31" font-size="12" letter-spacing="2" fill="#b6d17b">CHECK</text><text x="536" y="60" font-size="20" fill="#fff6e8">still frame</text>
    <rect x="774" width="230" height="84" rx="12" fill="#d47743"/><text x="794" y="31" font-size="12" letter-spacing="2" fill="#fff1df">OUTPUT</text><text x="794" y="60" font-size="20" fill="#fffaf2">MP4 / review</text>
  </g>
  <g fill="none" stroke="#ffbd76" stroke-width="2"><path d="M308 272h28M566 272h28M824 272h28"/><path d="m326 265 12 7-12 7M584 265l12 7-12 7M842 265l12 7-12 7"/></g>
  <text x="78" y="422" font-family="ui-monospace,monospace" font-size="14" fill="#c8c1b5">HyperFrames first when the format is unproven · Remotion once it repeats</text>
</svg>
